name: build-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: src-tauri/target/release/xlsform-studio.exe
          - os: ubuntu-22.04
            binary: src-tauri/target/release/xlsform-studio
          - os: macos-latest
            binary: src-tauri/target/release/xlsform-studio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      - run: pnpm install --frozen-lockfile

      - name: Build bundles (unsigned v1)
        run: pnpm tauri build

      - name: Report main binary size
        shell: bash
        run: |
          node scripts/check-binary-size.mjs "${{ matrix.binary }}" 15 | tee size.txt
          cat size.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: xlsform-studio-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
