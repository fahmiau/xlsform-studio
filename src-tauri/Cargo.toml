[package]
name = "xlsform-studio"
version = "1.0.0"
description = "Offline-first desktop IDE for authoring XLSForm .xlsx files"
authors = ["xlsform-studio contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "xlsform_studio_lib"
# Desktop-only v1: the rlib is enough. cdylib/staticlib are only needed for
# mobile targets and would pick up the test manifest link args.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.6.0"
# Pinned to the version dialog 2.6 needs. Newer 2.7.x build scripts are blocked
# by this machine's Smart App Control policy, so the pins stay exact.
tauri-plugin-fs = "=2.4.5"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# In-app updates (RELEASING.md). Windows-only distribution for now, but the
# crate builds on every desktop target. rustls-tls keeps OpenSSL out of the
# build, matching the reqwest choice below.
tauri-plugin-updater = "=2.14.1"
# Q-AI1: "Get a key" opens the system browser. Pinned to the frontend package
# version for the same reason.
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
# BYOK keys live in the OS credential store (AD-7). Platform backends are
# enabled per target below; no default features on purpose.
keyring = "=3.6.3"
# AI proxy client: rustls avoids OpenSSL, `stream` gives `bytes_stream()`.
reqwest = { version = "=0.12.28", default-features = false, features = [
  "rustls-tls",
  "stream",
  "http2",
] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
log = "0.4"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-plugin-agent-kit = { version = "0.1.0-alpha.1", optional = true }

[target.'cfg(windows)'.dependencies]
# WebView2 settings are not exposed by Tauri 2.12; the controller is used to
# turn off browser accelerator keys (Ctrl+R/F5) so they cannot reload the app.
# Both crates are already in the graph through wry.
webview2-com = "0.39"
windows-core = "0.62"
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service over D-Bus; rust crypto so a distro without OpenSSL headers
# can still build. A minimal distro without a Secret Service reports a clear
# keychain error (R6); keyless local providers keep working without one.
keyring = { version = "=3.6.3", features = [
  "sync-secret-service",
  "crypto-rust",
] }

[dev-dependencies]
tempfile = "3"
specta-typescript = "0.0.12"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# Optional agent-driven native UI inspection (Q5). Debug builds only; the
# plugin additionally requires TAURI_AGENT_KIT=1 at runtime. `unstable` is only
# pulled in by this feature, so default and release builds never enable it.
agent-kit = ["dep:tauri-plugin-agent-kit", "tauri/unstable"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Build scripts are run by the toolchain on every cold build. Small, optimized
# build scripts are also less likely to trip strict Application Control
# policies on developer machines.
[profile.dev.build-override]
opt-level = 2
debug = false
